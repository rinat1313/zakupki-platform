# Подключается из ./up.sh, если рядом есть sibling zakupki-search.
# Сервис: поисковые профили ЕИС (своя БД zakupki_search, миграции внутри образа).
# Порт платформы :8093 (в репо search дефолт :8091 — конфликтует с parser).

services:
  search:
    build:
      context: ${SEARCH_PATH:-../zakupki-search}
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8093"
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki_search?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      # без CORE_URL search ходит в ЕИС, но не пишет тендеры в core
      CORE_URL: ${CORE_URL:-http://core:8080}
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8093/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # gateway пока не проксирует search (нет SEARCH_URL в коде gateway);
  # UI/клиенты ходят на :8093 напрямую (CORS включён в search).
