# Подключается из ./up.sh, если рядом есть sibling zakupki-search.
# Дефолты приложения — в образе/репо search; здесь только Docker-wiring.

services:
  search:
    build:
      context: ${SEARCH_PATH:-../zakupki-search}
    environment:
      HTTP_ADDR: ":8093"
      # общая БД платформы (карточки/документы); остальное — дефолты сервиса
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy

  # опциональный wiring для потребителей search API
  core:
    environment:
      SEARCH_URL: ${SEARCH_URL:-http://search:8093}

  gateway:
    environment:
      SEARCH_URL: ${SEARCH_URL:-http://search:8093}
    depends_on:
      - search
