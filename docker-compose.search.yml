# Подключается из ./up.sh, если рядом есть sibling zakupki-search.
# Сервис: поисковые профили ЕИС (своя БД zakupki_search, миграции внутри образа).
# Порт платформы :8093 (в репо search дефолт :8091 — конфликтует с parser).

services:
  search:
    build:
      context: ${SEARCH_PATH:-../zakupki-search}
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8093"
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki_search?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8093/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  core:
    environment:
      SEARCH_URL: ${SEARCH_URL:-http://search:8093}

  gateway:
    environment:
      SEARCH_URL: ${SEARCH_URL:-http://search:8093}
    depends_on:
      - search
