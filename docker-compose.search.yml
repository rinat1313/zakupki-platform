services:
  search:
    build:
      context: ${SEARCH_PATH:-../zakupki-search}
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8093"
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki_search?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      CORE_URL: ${CORE_URL:-http://core:8080}
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8093/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  gateway:
    environment:
      SEARCH_URL: http://search:8093
    depends_on:
      search:
        condition: service_started
