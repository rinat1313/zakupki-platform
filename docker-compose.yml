# Оркестрация всех сервисов платформы закупок.
# Ожидаемая раскладка sibling-репозиториев:
#
#   parent/
#     zakupki-platform/   ← этот репозиторий
#     zakupki-core/
#     zakupki-gateway/
#     zakupki-parser/
#     zakupki-customer/
#     analizator_zakupok/
#
# Запуск:
#   make up
#   make up-ai   # + LM Studio / analizator

name: zakupki

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
      POSTGRES_DB: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    profiles: ["kafka"]

  parser:
    build:
      context: ${PARSER_PATH:-../zakupki-parser}
    environment:
      HTTP_ADDR: ":8091"
    ports:
      - "8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  core:
    build:
      context: ${CORE_PATH:-../zakupki-core}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable
      PARSER_URL: http://parser:8091
      ANALIZATOR_URL: ${ANALIZATOR_URL:-}
      INGEST_WORKERS: ${INGEST_WORKERS:-3}
      # Сколько карточек AI параллельно (не больше слотов LM Studio, обычно 4)
      ANALYZE_MAX_PARALLEL: ${ANALYZE_MAX_PARALLEL:-4}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_started

  customer:
    build:
      context: ${CUSTOMER_PATH:-../zakupki-customer}
    environment:
      HTTP_ADDR: ":8092"
    ports:
      - "8092:8092"

  gateway:
    build:
      context: ${GATEWAY_PATH:-../zakupki-gateway}
    environment:
      HTTP_ADDR: ":3000"
      CORE_URL: http://core:8080
      CUSTOMER_URL: http://customer:8092
      UI_DIR: /app/ui
    ports:
      - "3000:3000"
    depends_on:
      - core
      - customer

  analizator:
    profiles: ["ai"]
    build:
      context: ${ANALIZATOR_PATH:-../analizator_zakupok}
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      PROMPTS_DIR: /app/configs/prompts
      DEFAULT_CHECKLIST: ${DEFAULT_CHECKLIST:-default}
      PAGE_CHARS: ${PAGE_CHARS:-1800}
      DOSE_PAGES: ${DOSE_PAGES:-5}
      CONTEXT_BUDGET_CHARS: ${CONTEXT_BUDGET_CHARS:-10000}
      DOSE_MAX_TOKENS: ${DOSE_MAX_TOKENS:-1600}
      SYNTH_MAX_TOKENS: ${SYNTH_MAX_TOKENS:-2000}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://10.2.12.130:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-qwen/qwen3-8b}
      LM_STUDIO_ENDPOINTS_FILE: ${LM_STUDIO_ENDPOINTS_FILE:-/app/configs/lm_studio.yaml}
      ZAKUPKI_IN_DOCKER: "1"
      # Потолок параллельных запросов к LM Studio (слоты yaml / concurrent)
      LM_MAX_PARALLEL: ${LM_MAX_PARALLEL:-4}
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - analizator_data:/data/tenders
      # Живой yaml с хоста — без пересборки образа после правки пула
      - ${ANALIZATOR_PATH:-../analizator_zakupok}/configs/lm_studio.yaml:/app/configs/lm_studio.yaml:ro

volumes:
  pgdata:
  analizator_data:
