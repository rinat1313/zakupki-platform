# Пул LM Studio: 4 инстанса (имя host port).
# Правите IP/порты под свои машины. Локальный 127.0.0.1 / localhost
# в Docker станет host.docker.internal (см. scripts/lm-studio-start-pool.sh).
#
# Модель: qwen/qwen3-8b, context 8192, thinking off.
