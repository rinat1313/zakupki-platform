# Пул LM Studio: name host port (по одному на строку).
# Модель: qwen/qwen3-8b, context 8192, thinking off.
#
# На одном Mac обычно один сервер :1234 — скрипт поднимет его и
# пропишет concurrent=N в lm_studio.yaml.
# Для 4 отдельных машин укажите 4 разных IP (порт чаще всего 1234).
#
# НЕ указывайте эфемерные порты вроде 49928 — в LM Studio Server
# задайте фиксированный порт 1234.

lm-1 127.0.0.1 1234
# lm-2 192.168.1.20 1234
# lm-3 192.168.1.21 1234
# lm-4 192.168.1.22 1234
