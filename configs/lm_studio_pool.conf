# Пул LM Studio: name host port
#
# ЧЕСТНО: одна установка LM Studio на Mac = ОДИН HTTP-сервер (обычно :1234).
# Четыре отдельных сервера на одном Mac через `lms` НЕ поддерживаются.
#
# Что реально работает на одном Mac:
#   lm-1 127.0.0.1 1234
# → скрипт: lms load qwen/qwen3-8b --context-length 8192 --parallel 4
# → yaml: concurrent: 4  (4 параллельных слота AI на одном сервере)
#
# Четыре настоящих сервера = четыре машины (или 4 независимые установки LMS).
# Раскомментируйте и подставьте IP:
#
# lm-1 192.168.1.10 1234
# lm-2 192.168.1.20 1234
# lm-3 192.168.1.21 1234
# lm-4 192.168.1.22 1234
#
# Модель: qwen/qwen3-8b, context 8192, thinking off.
# Не указывайте эфемерные порты (49xxx) — только фиксированный 1234.

lm-1 127.0.0.1 1234
